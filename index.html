<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>정글 카운터픽 대시보드</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    // 다크 테마 컬러 팔레트 및 폰트 설정
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "Pretendard", "-apple-system", "BlinkMacSystemFont", "Malgun Gothic", "sans-serif"]
          },
          colors: {
            deep: {
              bg: "#090c14",
              panel: "#0f1422",
              row: "#131929",
              rowHover: "#192136",
              border: "#222b42",
              text: "#f1f5f9",
              muted: "#8a96b4",
              blue: "#3b82f6",
              tag: "#1b243b",
              tagBorder: "#2c3857"
            }
          }
        }
      }
    };
  </script>
  <style>
    /* 기본 다크 테마 및 가로 스크롤 방지 */
    body {
      background-color: #090c14;
      color: #f1f5f9;
      font-family: "Inter", "Pretendard", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      overflow-x: hidden;
    }
  </style>
</head>
<body class="min-h-screen bg-deep-bg text-deep-text antialiased selection:bg-blue-500/30 selection:text-white">
  <div class="w-full max-w-6xl mx-auto px-3 sm:px-6 py-5 sm:py-8">
    <!-- 상단 헤더 & 필터/정렬 영역 -->
    <header class="bg-deep-panel border border-deep-border rounded-2xl p-4 sm:p-6 mb-4 shadow-xl">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
        <div class="flex items-center gap-2.5 flex-wrap">
          <h1 class="text-lg sm:text-2xl font-extrabold tracking-tight text-white">
            정글 카운터픽 대시보드
          </h1>
          <span class="px-2.5 py-0.5 rounded-lg text-xs font-bold bg-blue-500/15 text-blue-300 border border-blue-500/35">
            DeepLoL 다크 · 1~5티어
          </span>
        </div>

        <!-- 외부 통계 링크 -->
        <a
          href="https://lol.ps/statistics"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold bg-deep-row hover:bg-deep-rowHover text-blue-300 hover:text-blue-200 border border-deep-border transition-colors w-fit"
        >
          <span>PS 챔피언 통계</span>
          <span aria-hidden="true">↗</span>
        </a>
      </div>

      <!-- 상대 챔피언 검색 입력창(한글 / 초성 / 영타 지원) -->
      <div class="relative mb-4">
        <input
          type="text"
          id="searchInput"
          autocomplete="off"
          placeholder="왼쪽 상대 챔피언 이름, 초성 또는 영타 검색 (예: ㄴㅍㄹ, wdf, 리신, 자이라)"
          class="w-full bg-deep-bg border border-deep-border focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 rounded-xl pl-4 pr-14 py-3 text-sm sm:text-base text-white placeholder-deep-muted outline-none transition-all"
        />
        <button
          type="button"
          id="clearSearchBtn"
          aria-label="검색어 지우기"
          class="hidden absolute right-3 top-1/2 -translate-y-1/2 px-2.5 py-1 rounded-lg text-xs font-semibold text-deep-muted hover:text-white bg-deep-row hover:bg-deep-rowHover border border-deep-border cursor-pointer transition-colors"
        >
          초기화
        </button>
      </div>

      <!-- 티어 필터 & 정렬 버튼 그룹 -->
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
        <div class="flex items-center gap-1.5 flex-wrap" id="tierGroup" role="group" aria-label="티어 필터">
          <button type="button" data-tier="ALL" class="tier-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all cursor-pointer"></button>
          <button type="button" data-tier="1" class="tier-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all cursor-pointer"></button>
          <button type="button" data-tier="2" class="tier-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all cursor-pointer"></button>
          <button type="button" data-tier="3" class="tier-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all cursor-pointer"></button>
          <button type="button" data-tier="4" class="tier-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all cursor-pointer"></button>
          <button type="button" data-tier="5" class="tier-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all cursor-pointer"></button>
        </div>

        <div class="flex items-center gap-1.5 flex-wrap" id="sortGroup" role="group" aria-label="정렬 기준">
          <button type="button" data-sort="TIER" class="sort-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold border transition-all cursor-pointer"></button>
          <button type="button" data-sort="DEFAULT" class="sort-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold border transition-all cursor-pointer"></button>
          <button type="button" data-sort="ALPHA" class="sort-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold border transition-all cursor-pointer"></button>
        </div>
      </div>
    </header>

    <!-- 요약 및 DDragon 패치 상태 바 -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 px-1 mb-3 text-xs sm:text-sm text-deep-muted">
      <div id="summaryText" class="font-medium">불러오는 중...</div>
      <div class="flex items-center gap-2 flex-wrap">
        <span id="ddragonPatchBadge" class="text-xs text-deep-muted">DDragon 패치 확인 중...</span>
        <span>·</span>
        <span>티어 배지는 왼쪽 상대 챔피언에만 표시됩니다</span>
      </div>
    </div>

    <!-- 데스크톱 컬럼 헤더 -->
    <div class="hidden md:grid grid-cols-[minmax(250px,1fr)_minmax(0,1.65fr)] items-center px-5 py-2.5 mb-2 rounded-xl bg-deep-panel/80 border border-deep-border/70 text-xs font-bold text-deep-muted tracking-wider">
      <span>티어 · 상대 챔피언 (ENEMY JUNGLE)</span>
      <span class="text-right">추천 카운터픽 (COUNTER PICKS)</span>
    </div>

    <!-- 매치업 행 목록 -->
    <main id="matchupList" class="flex flex-col gap-2.5"></main>

    <!-- 검색/필터 결과 없음 안내 -->
    <div id="emptyState" class="hidden bg-deep-panel border border-deep-border rounded-2xl py-14 px-6 text-center mt-4">
      <p class="text-deep-text font-semibold text-base mb-1">조건에 맞는 상대 챔피언이 없습니다.</p>
      <p class="text-deep-muted text-sm mb-4">검색어 또는 선택된 티어 필터를 초기화해 보세요.</p>
      <button
        type="button"
        id="resetFiltersBtn"
        class="px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold transition-colors cursor-pointer"
      >
        전체 초기화
      </button>
    </div>
  </div>

    const DDRAGON_FALLBACK_VERSIONS = ["16.1.1", "15.1.1", "14.24.1"];
    let activeDDragonVersion = DDRAGON_FALLBACK_VERSIONS[0];

    /**
     * 챔피언 사각형 아이콘 URL 생성
     * @param {string} name 챔피언 이름
     * @param {string} version Data Dragon 패치 버전
     * @returns {string}
     */
    function getChampionSquareIconUrl(name, version = activeDDragonVersion) {
      try {
        const canonical = CHAMPION_ALIAS_MAP[name] || name;
        const ddragonId = CHAMPION_DDRAGON_ID_MAP[name] || CHAMPION_DDRAGON_ID_MAP[canonical];
        if (!ddragonId) return "";
        return `https://ddragon.leagueoflegends.com/cdn/${version}/img/champion/${ddragonId}.png`;
      } catch (_err) {
        return "";
      }
    }

    /**
     * 챔피언 티어 계산 (기본 5티어)
     * @param {string} name
     * @returns {number}
     */
    function resolveTier(name) {
      const canonical = CHAMPION_ALIAS_MAP[name] || name;
      return JUNGLE_TIER_MAP[canonical] || 5;
    }

    /**
     * localStorage에서 저장된 카운터픽 맵 로드
     * @returns {Record<string, string[]> | null}
     */
    function loadSavedCounters() {
      try {
        const raw = window.localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object") {
          return parsed;
        }
      } catch (_err) {
        // 스토리지 접근 실패 시 null 반환
      }
      return null;
    }

    /**
     * 현재 MATCHUPS 상태를 localStorage에 영구 저장
     */
    function saveAllCounters() {
      try {
        const mapObj = {};
        MATCHUPS.forEach((item) => {
          mapObj[item.target] = [...item.counters];
        });
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(mapObj));
      } catch (_err) {
        // 스토리지 저장 제한 무시
      }
    }

    // 초기 데이터 로드 및 메모리 배열 구성
    const savedMap = loadSavedCounters();

    const MATCHUPS = RAW_COUNTER_MATCHUPS.map((entry, idx) => {
      const counters = savedMap && Array.isArray(savedMap[entry.target])
        ? [...savedMap[entry.target]]
        : [...entry.counters];
      return {
        order: idx,
        target: entry.target,
        tier: resolveTier(entry.target),
        counters
      };
    });

    if (!savedMap) {
      saveAllCounters();
    }

    // 현재 '+' 입력란이 열린 상대 챔피언 이름
    let activeAddTarget = null;

    /**
     * 티어순 정렬 기준 배열 반환
     */
    function getTierBaseMatchups() {
      return [...MATCHUPS].sort(
        (a, b) => a.tier - b.tier || a.order - b.order
      );
    }

    // 한글 자모 및 QWERTY 두벌식 조합 테이블
    const CHOSUNG_TABLE = [
      "ㄱ", "ㄲ", "ㄴ", "ㄷ", "ㄸ", "ㄹ", "ㅁ", "ㅂ", "ㅃ", "ㅅ",
      "ㅆ", "ㅇ", "ㅈ", "ㅉ", "ㅊ", "ㅋ", "ㅌ", "ㅍ", "ㅎ"
    ];

    const JUNGSUNG_TABLE = [
      "ㅏ", "ㅐ", "ㅑ", "ㅒ", "ㅓ", "ㅔ", "ㅕ", "ㅖ", "ㅗ", "ㅘ",
      "ㅙ", "ㅚ", "ㅛ", "ㅜ", "ㅝ", "ㅞ", "ㅟ", "ㅠ", "ㅡ", "ㅢ", "ㅣ"
    ];

    const JONGSUNG_TABLE = [
      "", "ㄱ", "ㄲ", "ㄳ", "ㄴ", "ㄵ", "ㄶ", "ㄷ", "ㄹ", "ㄺ",
      "ㄻ", "ㄼ", "ㄽ", "ㄾ", "ㄿ", "ㅀ", "ㅁ", "ㅂ", "ㅄ", "ㅅ",
      "ㅆ", "ㅇ", "ㅈ", "ㅊ", "ㅋ", "ㅌ", "ㅍ", "ㅎ"
    ];

    const QWERTY_TO_JAMO = {
      q: "ㅂ", w: "ㅈ", e: "ㄷ", r: "ㄱ", t: "ㅅ",
      y: "ㅛ", u: "ㅕ", i: "ㅑ", o: "ㅐ", p: "ㅔ",
      a: "ㅁ", s: "ㄴ", d: "ㅇ", f: "ㄹ", g: "ㅎ",
      h: "ㅗ", j: "ㅓ", k: "ㅏ", l: "ㅣ",
      z: "ㅋ", x: "ㅌ", c: "ㅊ", v: "ㅍ", b: "ㅠ", n: "ㅜ", m: "ㅡ",
      Q: "ㅃ", W: "ㅉ", E: "ㄸ", R: "ㄲ", T: "ㅆ",
      O: "ㅒ", P: "ㅖ"
    };

    const DOUBLE_JUNGSUNG_MAP = {
      "ㅗㅏ": "ㅘ",
      "ㅗㅐ": "ㅙ",
      "ㅗㅣ": "ㅚ",
      "ㅜㅓ": "ㅝ",
      "ㅜㅔ": "ㅞ",
      "ㅜㅣ": "ㅟ",
      "ㅡㅣ": "ㅢ"
    };

    const DOUBLE_JONGSUNG_MAP = {
      "ㄱㅅ": "ㄳ",
      "ㄴㅈ": "ㄵ",
      "ㄴㅎ": "ㄶ",
      "ㄹㄱ": "ㄺ",
      "ㄹㅁ": "ㄻ",
      "ㄹㅂ": "ㄼ",
      "ㄹㅅ": "ㄽ",
      "ㄹㅌ": "ㄾ",
      "ㄹㅍ": "ㄿ",
      "ㄹㅎ": "ㅀ",
      "ㅂㅅ": "ㅄ"
    };

    const SPLIT_DOUBLE_JONGSUNG_MAP = {
      "ㄳ": ["ㄱ", "ㅅ"],
      "ㄵ": ["ㄴ", "ㅈ"],
      "ㄶ": ["ㄴ", "ㅎ"],
      "ㄺ": ["ㄹ", "ㄱ"],
      "ㄻ": ["ㄹ", "ㅁ"],
      "ㄼ": ["ㄹ", "ㅂ"],
      "ㄽ": ["ㄹ", "ㅅ"],
      "ㄾ": ["ㄹ", "ㅌ"],
      "ㄿ": ["ㄹ", "ㅍ"],
      "ㅀ": ["ㄹ", "ㅎ"],
      "ㅄ": ["ㅂ", "ㅅ"]
    };

    const VOWEL_JAMO_SET = new Set([
      "ㅏ", "ㅐ", "ㅑ", "ㅒ", "ㅓ", "ㅔ", "ㅕ", "ㅖ",
      "ㅗ", "ㅘ", "ㅙ", "ㅚ", "ㅛ", "ㅜ", "ㅝ", "ㅞ", "ㅟ", "ㅠ", "ㅡ", "ㅢ", "ㅣ"
    ]);

    function isVowelJamo(jamo) {
      return VOWEL_JAMO_SET.has(jamo);
    }

    function isJongsungJamo(jamo) {
      return JONGSUNG_TABLE.includes(jamo) && jamo !== "";
    }

    function composeSyllable(cho, jung, jong = "") {
      const choIdx = CHOSUNG_TABLE.indexOf(cho);
      const jungIdx = JUNGSUNG_TABLE.indexOf(jung);
      const jongIdx = JONGSUNG_TABLE.indexOf(jong);
      if (choIdx < 0 || jungIdx < 0 || jongIdx < 0) return null;
      return String.fromCharCode(0xAC00 + choIdx * 588 + jungIdx * 28 + jongIdx);
    }

    /**
     * QWERTY 영타 입력을 자모열 및 조합형 한글로 변환
     * @param {string} rawText
     */
    function composeKoreanFromQwerty(rawText) {
      const lower = (rawText || "").toLowerCase();
      let jamoSeq = "";
      for (let i = 0; i < lower.length; i++) {
        const mapped = QWERTY_TO_JAMO[rawText[i]] || QWERTY_TO_JAMO[lower[i]] || lower[i];
        jamoSeq += mapped;
      }

      let result = "";
      let state = "IDLE";
      let cho = "";
      let jung = "";
      let jong = "";

      function flush() {
        if (state === "IDLE") return;
        if (state === "CHO") {
          result += cho;
        } else if (state === "JUNG") {
          result += composeSyllable(cho, jung, "") || (cho + jung);
        } else if (state === "JONG") {
          result += composeSyllable(cho, jung, jong) || (cho + jung + jong);
        }
        state = "IDLE";
        cho = "";
        jung = "";
        jong = "";
      }

      for (let i = 0; i < jamoSeq.length; i++) {
        const cur = jamoSeq[i];
        const isVow = isVowelJamo(cur);
        const isCho = CHOSUNG_TABLE.includes(cur);

        if (state === "IDLE") {
          if (isCho) {
            cho = cur;
            state = "CHO";
          } else {
            result += cur;
          }
        } else if (state === "CHO") {
          if (isVow) {
            jung = cur;
            state = "JUNG";
          } else {
            result += cho;
            cho = cur;
          }
        } else if (state === "JUNG") {
          if (isVow) {
            const combinedJung = DOUBLE_JUNGSUNG_MAP[jung + cur];
            if (combinedJung) {
              jung = combinedJung;
            } else {
              flush();
              result += cur;
            }
          } else if (isJongsungJamo(cur)) {
            jong = cur;
            state = "JONG";
          } else {
            flush();
            cho = cur;
            state = "CHO";
          }
        } else if (state === "JONG") {
          if (isVow) {
            const split = SPLIT_DOUBLE_JONGSUNG_MAP[jong];
            if (split) {
              result += composeSyllable(cho, jung, split[0]) || "";
              cho = split[1];
            } else {
              result += composeSyllable(cho, jung, "") || "";
              cho = jong;
            }
            jung = cur;
            jong = "";
            state = "JUNG";
          } else {
            const combinedJong = DOUBLE_JONGSUNG_MAP[jong + cur];
            if (combinedJong) {
              jong = combinedJong;
            } else {
              flush();
              cho = cur;
              state = "CHO";
            }
          }
        }
      }

      flush();
      return {
        jamoOnly: jamoSeq,
        composed: result
      };
    }

    /**
     * 완성형 한글에서 초성 추출
     * @param {string} text
     */
    function extractChosung(text) {
      let out = "";
      for (let i = 0; i < text.length; i++) {
        const code = text.charCodeAt(i);
        if (code >= 0xAC00 && code <= 0xD7A3) {
          out += CHOSUNG_TABLE[Math.floor((code - 0xAC00) / 588)];
        } else {
          out += text[i];
        }
      }
      return out;
    }

    function isOnlyChosung(text) {
      return /^[ㄱ-ㅎ]+$/.test(text);
    }

    /**
     * 상대 챔피언 이름과 검색어(한글/초성/영타) 일치 여부 판별
     * @param {string} targetName
     * @param {string} rawQuery
     */
    function matchesOpponentChampion(targetName, rawQuery) {
      const compactQuery = rawQuery.replace(/\s+/g, "").toLowerCase();
      if (!compactQuery) return true;

      const canonicalName = CHAMPION_ALIAS_MAP[targetName] || targetName;
      const candidates = [
        targetName.replace(/\s+/g, "").toLowerCase(),
        canonicalName.replace(/\s+/g, "").toLowerCase()
      ];

      const { jamoOnly, composed } = composeKoreanFromQwerty(compactQuery);
      const queryVariants = Array.from(
        new Set([compactQuery, jamoOnly.toLowerCase(), composed.toLowerCase()].filter(Boolean))
      );

      for (const cand of candidates) {
        const candChosung = extractChosung(cand).toLowerCase();
        for (const q of queryVariants) {
          if (cand.includes(q)) return true;
          if (isOnlyChosung(q) && candChosung.includes(q)) return true;
        }
      }
      return false;
    }

    /**
     * 티어 배지 Tailwind 클래스 반환
     * @param {number} tier
     */
    function getTierBadgeStyle(tier) {
      switch (tier) {
        case 1:
          return "bg-rose-500/15 text-rose-300 border-rose-500/40";
        case 2:
          return "bg-blue-500/15 text-blue-300 border-blue-500/40";
        case 3:
          return "bg-teal-400/15 text-teal-300 border-teal-400/40";
        case 4:
          return "bg-slate-400/15 text-slate-300 border-slate-400/35";
        default:
          return "bg-zinc-500/15 text-zinc-400 border-zinc-500/30";
      }
    }

    /**
     * 이니셜 SVG 폴백용 그라데이션 팔레트 선택
     * @param {string} name
     */
    function getAvatarPalette(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      const palettes = [
        { from: "#26365c", to: "#151d33", ring: "#4f86ff" },
        { from: "#4a2338", to: "#24121d", ring: "#ff5d6c" },
        { from: "#1b4347", to: "#0f2427", ring: "#2dd4bf" },
        { from: "#3b2c5e", to: "#1d1630", ring: "#a78bfa" },
        { from: "#4d381e", to: "#261b0e", ring: "#fbbf24" }
      ];
      return palettes[Math.abs(hash) % palettes.length];
    }

    /**
     * 아이콘 로드 실패 시 렌더링할 SVG 이니셜 아바타 생성
     * @param {string} label
     * @param {string} sizeClass
     */
    function createInitialFallbackSvg(label, sizeClass) {
      const char = (label || "?").trim().charAt(0);
      const pal = getAvatarPalette(label);
      const gradId = `g_${char.charCodeAt(0)}_${Math.abs(label.length * 17)}`;
      return `
        <svg class="${sizeClass} rounded-xl shrink-0 select-none" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="${gradId}" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="${pal.from}" />
              <stop offset="100%" stop-color="${pal.to}" />
            </linearGradient>
          </defs>
          <rect width="40" height="40" rx="11" fill="url(#${gradId})" stroke="${pal.ring}" stroke-opacity="0.45" stroke-width="1.5" />
          <text x="20" y="25" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Pretendard, sans-serif">${char}</text>
        </svg>
      `;
    }

    /**
     * DDragon 사각형 아이콘 및 폴백 체인 HTML 생성
     * @param {string} name
     * @param {string} sizeClass
     * @param {string} imgClass
     */
    function createChampionIconHtml(name, sizeClass, imgClass) {
      const iconUrl = getChampionSquareIconUrl(name);
      const fallbackSvg = createInitialFallbackSvg(name, sizeClass);
      if (!iconUrl) {
        return `<span class="inline-flex items-center justify-center shrink-0">${fallbackSvg}</span>`;
      }

      const fallbackVersion = DDRAGON_FALLBACK_VERSIONS[DDRAGON_FALLBACK_VERSIONS.length - 1];
      const fallbackUrl = getChampionSquareIconUrl(name, fallbackVersion);

      return `
        <span class="relative inline-flex items-center justify-center ${sizeClass} rounded-xl overflow-hidden bg-deep-panel border border-deep-border shrink-0">
          <img
            src="${iconUrl}"
            alt="${name}"
            loading="lazy"
            decoding="async"
            class="${imgClass} object-cover"
            onerror="if (!this.dataset.fb) { this.dataset.fb = '1'; this.src = '${fallbackUrl}'; } else { this.style.display = 'none'; this.nextElementSibling.style.display = 'flex'; }"
          />
          <span class="hidden w-full h-full items-center justify-center">${fallbackSvg}</span>
        </span>
      `;
    }

    /**
     * '+' 입력란에서 새 카운터픽 추가 및 localStorage 저장
     * @param {string} targetName
     * @param {string} rawCounterName
     */
    function addCounterToTarget(targetName, rawCounterName) {
      const trimmed = (rawCounterName || "").trim();
      if (!trimmed) return false;
      const row = MATCHUPS.find((m) => m.target === targetName);
      if (!row) return false;
      if (!row.counters.includes(trimmed)) {
        row.counters.push(trimmed);
        saveAllCounters();
      }
      return true;
    }

    /**
     * 원본3 기준: '+' 버튼이 활성화된 행의 카운터픽 칩 옆 'X' 버튼 클릭 시
     * 메모리(MATCHUPS 배열)에서만 해당 카운터픽 1개를 제거하고 화면을 다시 그리며,
     * localStorage(jungle_counterpick_custom_v1)에는 반영하지 않아 새로고침 시 저장된 데이터가 유지됨.
     * @param {string} targetName
     * @param {number} counterIndex
     */
    function tempRemoveCounterFromMemory(targetName, counterIndex) {
      const row = MATCHUPS.find((m) => m.target === targetName);
      if (!row) return;
      if (counterIndex >= 0 && counterIndex < row.counters.length) {
        row.counters.splice(counterIndex, 1);
        renderDashboard();
      }
    }

    let selectedTier = "ALL";
    let selectedSort = "TIER";

    const searchInput = document.getElementById("searchInput");
    const clearSearchBtn = document.getElementById("clearSearchBtn");
    const matchupList = document.getElementById("matchupList");
    const summaryText = document.getElementById("summaryText");
    const ddragonPatchBadge = document.getElementById("ddragonPatchBadge");
    const emptyState = document.getElementById("emptyState");
    const resetFiltersBtn = document.getElementById("resetFiltersBtn");
    const tierButtons = document.querySelectorAll(".tier-btn");
    const sortButtons = document.querySelectorAll(".sort-btn");

    /**
     * 티어 필터 및 정렬 버튼 활성 상태 갱신
     */
    function updateFilterButtonStyles() {
      tierButtons.forEach((btn) => {
        const tierVal = btn.getAttribute("data-tier");
        const isActive = selectedTier === tierVal;
        btn.textContent = tierVal === "ALL" ? "전체 티어" : `${tierVal}티어`;
        btn.className = isActive
          ? "tier-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all cursor-pointer bg-blue-600 text-white border-blue-400 shadow-sm shadow-blue-600/30"
          : "tier-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all cursor-pointer bg-deep-row hover:bg-deep-rowHover text-deep-muted hover:text-white border-deep-border";
      });

      sortButtons.forEach((btn) => {
        const sortVal = btn.getAttribute("data-sort");
        const isActive = selectedSort === sortVal;
        const labelMap = {
          TIER: "티어순",
          DEFAULT: "기본순",
          ALPHA: "가나다순"
        };
        btn.textContent = labelMap[sortVal] || sortVal;
        btn.className = isActive
          ? "sort-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold border transition-all cursor-pointer bg-blue-600/20 text-blue-200 border-blue-500/60"
          : "sort-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold border transition-all cursor-pointer bg-deep-row hover:bg-deep-rowHover text-deep-muted hover:text-white border-deep-border";
      });
    }

    /**
     * 필터 및 정렬 조건이 적용된 매치업 목록 반환
     */
    function getFilteredAndSortedMatchups() {
      const query = searchInput.value.trim();

      let list =
        selectedSort === "DEFAULT"
          ? [...MATCHUPS].sort((a, b) => a.order - b.order)
          : getTierBaseMatchups();

      if (selectedTier !== "ALL") {
        const targetTierNum = Number(selectedTier);
        list = list.filter((item) => item.tier === targetTierNum);
      }

      if (query) {
        list = list.filter((item) => matchesOpponentChampion(item.target, query));
      }

      if (selectedSort === "ALPHA") {
        list = [...list].sort((a, b) => a.target.localeCompare(b.target, "ko"));
      }

      return list;
    }

    /**
     * HTML 속성 이스케이프
     * @param {unknown} str
     */
    function escapeAttr(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;");
    }

    /**
     * 대시보드 행 렌더링
     */
    function renderDashboard() {
      updateFilterButtonStyles();

      const query = searchInput.value.trim();
      clearSearchBtn.classList.toggle("hidden", query.length === 0);

      const rows = getFilteredAndSortedMatchups();
      const sortLabel =
        selectedSort === "TIER" ? "티어순" : selectedSort === "DEFAULT" ? "기본순" : "가나다순";
      const tierLabel = selectedTier === "ALL" ? "전체 티어" : `${selectedTier}티어`;

      summaryText.textContent = `표시 중 ${rows.length}개 / 전체 ${MATCHUPS.length}개 · ${tierLabel} · ${sortLabel}`;

      if (rows.length === 0) {
        matchupList.innerHTML = "";
        emptyState.classList.remove("hidden");
        return;
      }

      emptyState.classList.add("hidden");

      matchupList.innerHTML = rows
        .map((item) => {
          const isAddingHere = activeAddTarget === item.target;

          // '+' 버튼이 활성화된 행에서만 카운터픽 칩 옆에 'X' 버튼 표시
          const counterChipsHtml = item.counters
            .map((counterName, idx) => {
              const removeBtnHtml = isAddingHere
                ? `<button
                    type="button"
                    data-temp-remove-target="${escapeAttr(item.target)}"
                    data-temp-remove-index="${idx}"
                    title="${escapeAttr(counterName)} 임시 제거"
                    aria-label="${escapeAttr(counterName)} 임시 제거"
                    class="ml-0.5 inline-flex items-center justify-center w-4 h-4 rounded text-xs font-extrabold text-rose-300 hover:text-white hover:bg-rose-500/40 cursor-pointer transition-colors"
                  >X</button>`
                : "";

              return `
                <span class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-deep-tag border border-deep-tagBorder text-xs sm:text-sm font-semibold text-slate-100 whitespace-nowrap">
                  ${createChampionIconHtml(counterName, "w-5 h-5 sm:w-6 sm:h-6", "w-5 h-5 sm:w-6 sm:h-6")}
                  <span>${counterName}</span>
                  ${removeBtnHtml}
                </span>
              `;
            })
            .join("");

          const addBoxHtml = isAddingHere
            ? `
              <div class="inline-flex items-center gap-1.5 bg-deep-bg border border-blue-500/60 rounded-xl px-2 py-1" data-add-box="${escapeAttr(item.target)}">
                <input
                  type="text"
                  data-add-input="${escapeAttr(item.target)}"
                  placeholder="카운터 챔프 입력"
                  autocomplete="off"
                  class="w-28 sm:w-32 bg-transparent text-xs sm:text-sm text-white placeholder-deep-muted outline-none px-1 py-0.5"
                />
                <button
                  type="button"
                  data-confirm-add="${escapeAttr(item.target)}"
                  class="px-2 py-1 rounded-lg text-xs font-bold bg-blue-600 hover:bg-blue-500 text-white cursor-pointer transition-colors"
                >확인</button>
                <button
                  type="button"
                  data-cancel-add="${escapeAttr(item.target)}"
                  class="px-1.5 py-1 rounded-lg text-xs font-bold text-deep-muted hover:text-white cursor-pointer transition-colors"
                >취소</button>
              </div>
            `
            : `
              <button
                type="button"
                data-open-add="${escapeAttr(item.target)}"
                title="${escapeAttr(item.target)} 카운터픽 추가"
                aria-label="${escapeAttr(item.target)} 카운터픽 추가"
                class="inline-flex items-center justify-center w-8 h-8 rounded-xl bg-deep-tag hover:bg-blue-600/30 text-blue-300 hover:text-white border border-deep-tagBorder hover:border-blue-500/60 text-base font-extrabold transition-colors cursor-pointer shrink-0"
              >+</button>
            `;

          return `
            <article class="grid grid-cols-1 md:grid-cols-[minmax(250px,1fr)_minmax(0,1.65fr)] items-center gap-3 md:gap-4 px-4 sm:px-5 py-3.5 rounded-2xl bg-deep-row hover:bg-deep-rowHover border border-deep-border transition-colors">
              <div class="flex items-center gap-3 min-w-0">
                <span class="inline-flex items-center justify-center px-2.5 py-1 rounded-lg text-xs font-extrabold border shrink-0 ${getTierBadgeStyle(item.tier)}">
                  ${item.tier}티어
                </span>
                ${createChampionIconHtml(item.target, "w-9 h-9 sm:w-10 sm:h-10", "w-9 h-9 sm:w-10 sm:h-10")}
                <span class="text-sm sm:text-base font-bold text-white truncate">${item.target}</span>
              </div>

              <div class="flex items-center justify-start md:justify-end gap-2 flex-wrap pt-2 md:pt-0 border-t md:border-t-0 border-deep-border/60">
                ${counterChipsHtml}
                ${addBoxHtml}
              </div>
            </article>
          `;
        })
        .join("");

      if (activeAddTarget) {
        const inputEl = matchupList.querySelector(`[data-add-input="${CSS.escape(activeAddTarget)}"]`);
        if (inputEl) {
          inputEl.focus();
        }
      }
    }

    // 리스트 클릭 이벤트 위임 ('X' 임시 제거, '+' 열기, 확인, 취소)
    matchupList.addEventListener("click", (e) => {
      const tempRemoveBtn = e.target.closest("[data-temp-remove-target][data-temp-remove-index]");
      if (tempRemoveBtn) {
        const target = tempRemoveBtn.getAttribute("data-temp-remove-target");
        const idx = Number(tempRemoveBtn.getAttribute("data-temp-remove-index"));
        tempRemoveCounterFromMemory(target, idx);
        return;
      }

      const openBtn = e.target.closest("[data-open-add]");
      if (openBtn) {
        activeAddTarget = openBtn.getAttribute("data-open-add");
        renderDashboard();
        return;
      }

      const confirmBtn = e.target.closest("[data-confirm-add]");
      if (confirmBtn) {
        const target = confirmBtn.getAttribute("data-confirm-add");
        const inputEl = matchupList.querySelector(`[data-add-input="${CSS.escape(target)}"]`);
        if (inputEl && addCounterToTarget(target, inputEl.value)) {
          activeAddTarget = null;
          renderDashboard();
        }
        return;
      }

      const cancelBtn = e.target.closest("[data-cancel-add]");
      if (cancelBtn) {
        activeAddTarget = null;
        renderDashboard();
      }
    });

    // 카운터픽 입력란 Enter / Escape 키 처리
    matchupList.addEventListener("keydown", (e) => {
      const inputEl = e.target.closest("[data-add-input]");
      if (!inputEl) return;
      const target = inputEl.getAttribute("data-add-input");
      if (e.key === "Enter") {
        e.preventDefault();
        if (addCounterToTarget(target, inputEl.value)) {
          activeAddTarget = null;
          renderDashboard();
        }
      } else if (e.key === "Escape") {
        activeAddTarget = null;
        renderDashboard();
      }
    });

    /**
     * Data Dragon 최신 패치 버전 조회 및 폴백 처리
     */
    async function resolveLatestDDragonPatch() {
      try {
        const res = await fetch("https://ddragon.leagueoflegends.com/api/versions.json", {
          cache: "no-store"
        });
        if (!res.ok) throw new Error("Failed to fetch DDragon versions");
        const versions = await res.json();
        if (Array.isArray(versions) && versions.length > 0 && typeof versions[0] === "string") {
          activeDDragonVersion = versions[0];
          ddragonPatchBadge.textContent = `DDragon ${activeDDragonVersion}`;
          renderDashboard();
          return;
        }
        throw new Error("Empty DDragon version list");
      } catch (_err) {
        ddragonPatchBadge.textContent = `DDragon ${activeDDragonVersion} (폴백)`;
      }
    }

    searchInput.addEventListener("input", renderDashboard);

    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = "";
      renderDashboard();
      searchInput.focus();
    });

    tierButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        selectedTier = btn.getAttribute("data-tier") || "ALL";
        renderDashboard();
      });
    });

    sortButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        selectedSort = btn.getAttribute("data-sort") || "TIER";
        renderDashboard();
      });
    });

    resetFiltersBtn.addEventListener("click", () => {
      searchInput.value = "";
      selectedTier = "ALL";
      selectedSort = "TIER";
      activeAddTarget = null;
      renderDashboard();
    });

    renderDashboard();
    resolveLatestDDragonPatch();
  </script>
</body>
</html>
