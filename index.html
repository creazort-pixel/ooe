<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>정글 카운터픽 대시보드 (DeepLoL 스타일)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "Pretendard", "-apple-system", "BlinkMacSystemFont", "Malgun Gothic", "sans-serif"]
          },
          colors: {
            deep: {
              bg: "#090c14",
              panel: "#0f1422",
              row: "#131929",
              rowHover: "#192136",
              border: "#222b42",
              text: "#f1f5f9",
              muted: "#8a96b4",
              blue: "#3b82f6",
              tag: "#1b243b",
              tagBorder: "#2c3857"
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #090c14;
      color: #f1f5f9;
      font-family: "Inter", "Pretendard", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      overflow-x: hidden;
    }
  </style>
</head>
<body class="min-h-screen bg-deep-bg text-deep-text antialiased selection:bg-blue-500/30 selection:text-white">
  <div class="w-full max-w-6xl mx-auto px-3 sm:px-6 py-5 sm:py-8">
    <!-- 상단 헤더 & 필터/정렬 컨트롤 -->
    <header class="bg-deep-panel border border-deep-border rounded-2xl p-4 sm:p-6 mb-4 shadow-xl">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
        <div class="flex items-center gap-2.5 flex-wrap">
          <h1 class="text-lg sm:text-2xl font-extrabold tracking-tight text-white">
            정글 카운터픽 대시보드
          </h1>
          <span class="px-2.5 py-0.5 rounded-lg text-xs font-bold bg-blue-500/15 text-blue-300 border border-blue-500/35">
            DeepLoL 다크 · 1~5티어
          </span>
        </div>

        <a
          href="https://lol.ps/statistics"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold bg-deep-row hover:bg-deep-rowHover text-blue-300 hover:text-blue-200 border border-deep-border transition-colors w-fit"
        >
          <span>PS 챔피언 통계</span>
          <span aria-hidden="true">↗</span>
        </a>
      </div>

      <!-- 왼쪽 상대 챔피언 검색창 -->
      <div class="relative mb-4">
        <input
          type="text"
          id="searchInput"
          autocomplete="off"
          placeholder="왼쪽 상대 챔피언 이름, 초성 또는 영타 검색 (예: ㄴㅍㄹ, wdf, 리신, 자이라)"
          class="w-full bg-deep-bg border border-deep-border focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 rounded-xl pl-4 pr-11 py-3 text-sm sm:text-base text-white placeholder-deep-muted outline-none transition-all"
        />
        <button
          type="button"
          id="clearSearchBtn"
          aria-label="검색어 지우기"
          class="hidden absolute right-3 top-1/2 -translate-y-1/2 px-2.5 py-1 rounded-lg text-xs font-semibold text-deep-muted hover:text-white bg-deep-row hover:bg-deep-rowHover border border-deep-border cursor-pointer transition-colors"
        >
          초기화
        </button>
      </div>

      <!-- 티어 필터 & 정렬 버튼 -->
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
        <div class="flex items-center gap-1.5 flex-wrap" id="tierGroup" role="group" aria-label="티어 필터">
          <button type="button" data-tier="ALL" class="tier-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all cursor-pointer"></button>
          <button type="button" data-tier="1" class="tier-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all cursor-pointer"></button>
          <button type="button" data-tier="2" class="tier-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all cursor-pointer"></button>
          <button type="button" data-tier="3" class="tier-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all cursor-pointer"></button>
          <button type="button" data-tier="4" class="tier-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all cursor-pointer"></button>
          <button type="button" data-tier="5" class="tier-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all cursor-pointer"></button>
        </div>

        <div class="flex items-center gap-1.5 flex-wrap" id="sortGroup" role="group" aria-label="정렬 기준">
          <button type="button" data-sort="TIER" class="sort-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold border transition-all cursor-pointer"></button>
          <button type="button" data-sort="DEFAULT" class="sort-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold border transition-all cursor-pointer"></button>
          <button type="button" data-sort="ALPHA" class="sort-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold border transition-all cursor-pointer"></button>
        </div>
      </div>
    </header>

    <!-- 상태 요약 바 -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 px-1 mb-3 text-xs sm:text-sm text-deep-muted">
      <div id="summaryText" class="font-medium">불러오는 중...</div>
      <div class="flex items-center gap-2 flex-wrap">
        <span id="ddragonPatchBadge" class="text-xs text-deep-muted">DDragon 패치 확인 중...</span>
        <span>·</span>
        <button
          type="button"
          id="resetAllCountersBtn"
          class="hidden text-xs font-semibold text-blue-300 hover:text-blue-200 underline underline-offset-2 cursor-pointer transition-colors"
        >
          커스텀 카운터 전체 초기화
        </button>
        <span id="resetAllDivider" class="hidden">·</span>
        <span>티어 배지는 왼쪽 상대 챔피언에만 표시됩니다</span>
      </div>
    </div>

    <!-- 데스크톱 1줄 컬럼 헤더 -->
    <div class="hidden md:grid grid-cols-[minmax(250px,1fr)_minmax(0,1.65fr)] items-center px-5 py-2.5 mb-2 rounded-xl bg-deep-panel/80 border border-deep-border/70 text-xs font-bold text-deep-muted tracking-wider">
      <span>티어 · 상대 챔피언 (ENEMY JUNGLE)</span>
      <span class="text-right">추천 카운터픽 (COUNTER PICKS)</span>
    </div>

    <!-- 1줄 가로 카드 리스트 -->
    <main id="matchupList" class="flex flex-col gap-2.5"></main>

    <!-- 빈 결과 안내 -->
    <div id="emptyState" class="hidden bg-deep-panel border border-deep-border rounded-2xl py-14 px-6 text-center mt-4">
      <p class="text-deep-text font-semibold text-base mb-1">조건에 맞는 상대 챔피언이 없습니다.</p>
      <p class="text-deep-muted text-sm mb-4">검색어 또는 선택된 티어 필터를 초기화해 보세요.</p>
      <button
        type="button"
        id="resetFiltersBtn"
        class="px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold transition-colors cursor-pointer"
      >
        전체 초기화
      </button>
    </div>
  </div>

  <!-- 카운터픽 수정 모달 -->
  <div
    id="counterEditorModal"
    class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-xs flex items-center justify-center p-3 sm:p-5"
    role="dialog"
    aria-modal="true"
    aria-labelledby="editorModalTitle"
  >
    <div class="w-full max-w-xl bg-deep-panel border border-deep-border rounded-2xl shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between gap-3 px-4 sm:px-6 py-4 border-b border-deep-border bg-deep-row/70">
        <div class="flex items-center gap-2.5 min-w-0">
          <span id="editorTargetTierBadge" class="inline-flex items-center justify-center px-2.5 py-1 rounded-lg text-xs font-extrabold border shrink-0"></span>
          <div id="editorTargetIcon" class="shrink-0"></div>
          <div class="min-w-0">
            <h2 id="editorModalTitle" class="text-base sm:text-lg font-extrabold text-white truncate">카운터픽 수정</h2>
            <p class="text-xs text-deep-muted">카운터 챔피언 추가 및 삭제가 즉시 저장됩니다.</p>
          </div>
        </div>
        <button
          type="button"
          id="closeEditorModalBtn"
          aria-label="창 닫기"
          class="w-9 h-9 rounded-xl bg-deep-bg hover:bg-deep-rowHover border border-deep-border text-deep-muted hover:text-white flex items-center justify-center font-bold cursor-pointer transition-colors shrink-0"
        >
          ✕
        </button>
      </div>

      <div class="p-4 sm:p-6 space-y-5 max-h-[82vh] overflow-y-auto">
        <!-- 현재 등록된 카운터픽 목록 -->
        <div>
          <div class="flex items-center justify-between gap-2 mb-2.5">
            <span class="text-xs sm:text-sm font-bold text-slate-200">현재 카운터픽</span>
            <button
              type="button"
              id="resetRowCountersBtn"
              class="text-xs font-semibold text-blue-300 hover:text-blue-200 bg-deep-row hover:bg-deep-rowHover border border-deep-border px-2.5 py-1 rounded-lg cursor-pointer transition-colors"
            >
              이 줄 기본값 복원
            </button>
          </div>
          <div id="editorCurrentCounters" class="flex flex-wrap gap-2 min-h-[42px] p-3 rounded-xl bg-deep-bg border border-deep-border"></div>
        </div>

        <!-- 카운터 챔피언 직접 추가 -->
        <div>
          <label for="editorCounterInput" class="block text-xs sm:text-sm font-bold text-slate-200 mb-2">
            카운터 챔피언 추가 (한글명·별칭·초성·영문 두벌식 지원)
          </label>
          <div class="flex items-center gap-2">
            <input
              type="text"
              id="editorCounterInput"
              autocomplete="off"
              placeholder="예: 리신, ㅋㅈㅅ, shryt 또는 목록에서 선택"
              class="flex-1 bg-deep-bg border border-deep-border focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-deep-muted outline-none transition-all"
            />
            <button
              type="button"
              id="addCounterSubmitBtn"
              class="px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold cursor-pointer transition-colors shrink-0"
            >
              추가
            </button>
          </div>
          <p id="editorFeedbackMsg" class="hidden mt-2 text-xs font-medium"></p>

          <!-- 빠른 선택 챔피언 칩 -->
          <div class="mt-3">
            <div class="text-xs text-deep-muted mb-2">빠른 선택 추천·정글 챔피언</div>
            <div id="editorQuickPickList" class="flex flex-wrap gap-1.5 max-h-40 overflow-y-auto p-2.5 rounded-xl bg-deep-bg/80 border border-deep-border"></div>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 px-4 sm:px-6 py-3.5 border-t border-deep-border bg-deep-row/50">
        <button
          type="button"
          id="doneEditorModalBtn"
          class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold cursor-pointer transition-colors"
        >
          완료
        </button>
      </div>
    </div>
  </div>

  <script>
    /**
     * 1티어 ~ 5티어 전체 58개 정글 챔피언 티어 맵

    const DDRAGON_FALLBACK_VERSIONS = ["16.1.1", "15.1.1", "14.24.1"];
    let activeDDragonVersion = DDRAGON_FALLBACK_VERSIONS[0];

    function getChampionSquareIconUrl(name, version = activeDDragonVersion) {
      const canonical = CHAMPION_ALIAS_MAP[name] || name;
      const ddragonId = CHAMPION_DDRAGON_ID_MAP[name] || CHAMPION_DDRAGON_ID_MAP[canonical];
      if (!ddragonId) return "";
      return `https://ddragon.leagueoflegends.com/cdn/${version}/img/champion/${ddragonId}.png`;
    }

    /**
     * 정글 카운터픽 데이터 (우측 카운터픽 태그에는 티어를 붙이지 않음)
     */

      { target: "다이에나", counters: ["녹턴"] },
      { target: "나피리", counters: ["녹턴"] },

      { target: "렝가", counters: ["람머스", "세주아니", "아무무"] }
    ];

    function resolveTier(name) {
      const canonical = CHAMPION_ALIAS_MAP[name] || name;
      return JUNGLE_TIER_MAP[canonical] || 5;
    }

    const CUSTOM_COUNTERS_STORAGE_KEY = "jungle_counter_dashboard_custom_v1";

    function loadCustomCountersFromStorage() {
      try {
        const raw = window.localStorage.getItem(CUSTOM_COUNTERS_STORAGE_KEY);
        if (!raw) return {};
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return {};
        const sanitized = {};
        Object.keys(parsed).forEach((key) => {
          if (Array.isArray(parsed[key])) {
            sanitized[key] = parsed[key]
              .filter((item) => typeof item === "string" && item.trim().length > 0)
              .map((item) => item.trim());
          }
        });
        return sanitized;
      } catch (_err) {
        return {};
      }
    }

    let customCountersMap = loadCustomCountersFromStorage();

    function saveCustomCountersToStorage() {
      try {
        window.localStorage.setItem(CUSTOM_COUNTERS_STORAGE_KEY, JSON.stringify(customCountersMap));
      } catch (_err) {
        // 저장소 접근 제한 시 메모리 상태만 유지
      }
    }

    const BASE_MATCHUPS = RAW_COUNTER_MATCHUPS.map((entry, idx) => ({
      order: idx,
      target: entry.target,
      tier: resolveTier(entry.target),
      defaultCounters: [...entry.counters]
    }));

    function getActiveCounters(item) {
      if (Object.prototype.hasOwnProperty.call(customCountersMap, item.target)) {
        return [...customCountersMap[item.target]];
      }
      return [...item.defaultCounters];
    }

    function hasCustomCounterOverride(item) {
      if (!Object.prototype.hasOwnProperty.call(customCountersMap, item.target)) return false;
      const current = customCountersMap[item.target];
      const base = item.defaultCounters;
      if (current.length !== base.length) return true;
      return current.some((name, idx) => name !== base[idx]);
    }

    function getAllKnownChampions() {
      const seen = new Set();
      const list = [];
      const pushName = (raw) => {
        const cleaned = (raw || "").trim();
        if (!cleaned) return;
        const canonical = CHAMPION_ALIAS_MAP[cleaned] || cleaned;
        const key = canonical.replace(/\s+/g, "").toLowerCase();
        if (!seen.has(key)) {
          seen.add(key);
          list.push(canonical);
        }
      };

      Object.keys(JUNGLE_TIER_MAP).forEach(pushName);
      Object.keys(CHAMPION_ALIAS_MAP).forEach(pushName);
      Object.keys(CHAMPION_DDRAGON_ID_MAP).forEach(pushName);
      BASE_MATCHUPS.forEach((m) => {
        pushName(m.target);
        m.defaultCounters.forEach(pushName);
      });
      Object.values(customCountersMap).forEach((arr) => {
        if (Array.isArray(arr)) arr.forEach(pushName);
      });

      return list.sort((a, b) => a.localeCompare(b, "ko"));
    }

    function normalizeCounterInputName(rawInput) {
      const trimmed = (rawInput || "").trim();
      if (!trimmed) return "";
      if (CHAMPION_ALIAS_MAP[trimmed]) {
        return CHAMPION_ALIAS_MAP[trimmed];
      }
      const compact = trimmed.replace(/\s+/g, "").toLowerCase();
      const converted = convertQwertyToHangul(compact).replace(/\s+/g, "").toLowerCase();
      const allKnown = getAllKnownChampions();

      const exactMatch = allKnown.find((champ) => {
        const cCompact = champ.replace(/\s+/g, "").toLowerCase();
        const aliasTarget = (CHAMPION_ALIAS_MAP[champ] || champ).replace(/\s+/g, "").toLowerCase();
        return cCompact === compact || aliasTarget === compact || cCompact === converted || aliasTarget === converted;
      });
      if (exactMatch) return exactMatch;

      const partialMatch = allKnown.find((champ) => {
        const cCompact = champ.replace(/\s+/g, "").toLowerCase();
        return (
          (compact.length >= 2 && cCompact.includes(compact)) ||
          (converted.length >= 2 && cCompact.includes(converted))
        );
      });
      if (partialMatch) return partialMatch;

      return trimmed;
    }

    function getMatchupsSnapshot() {
      return BASE_MATCHUPS.map((item) => ({
        order: item.order,
        target: item.target,
        tier: item.tier,
        counters: getActiveCounters(item),
        defaultCounters: item.defaultCounters,
        isCustomized: hasCustomCounterOverride(item)
      }));
    }

    // 티어순(1티어 -> 5티어)을 기본 베이스로 삼되, 동일 티어 내에서는 원래 순서를 유지
    function getTierBaseMatchups() {
      return getMatchupsSnapshot().sort(
        (a, b) => a.tier - b.tier || a.order - b.order
      );
    }

    // 한글 초성 추출 및 영문 두벌식(QWERTY) 자판 변환 유틸리티
            cho = cur;
            state = "CHO";
          } else {
            result += cur;
          }
        } else if (state === "CHO") {
          if (isVow) {
            jung = cur;
            state = "JUNG";
          } else {
            result += cho;
            cho = cur;
          }
        } else if (state === "JUNG") {
          if (isVow) {
            const combinedJung = DOUBLE_JUNGSUNG_MAP[jung + cur];
            if (combinedJung) {
              jung = combinedJung;
            } else {
              flush();
              result += cur;
            }
          } else if (isJongsungJamo(cur)) {
            jong = cur;
            state = "JONG";
          } else {
            flush();
            cho = cur;
            state = "CHO";
          }
        } else if (state === "JONG") {
          if (isVow) {
            const split = SPLIT_DOUBLE_JONGSUNG_MAP[jong];
            if (split) {
              result += composeSyllable(cho, jung, split[0]) || "";
              cho = split[1];
            } else {
              result += composeSyllable(cho, jung, "") || "";
              cho = jong;
            }
            jung = cur;
            jong = "";
            state = "JUNG";
          } else {
            const combinedJong = DOUBLE_JONGSUNG_MAP[jong + cur];
            if (combinedJong) {
              jong = combinedJong;
            } else {
              flush();
              cho = cur;
              state = "CHO";
            }
          }
        }
      }

      flush();
      return {
        jamoOnly: jamoSeq,
        composed: result
      };
    }

    function extractChosung(text) {
      let out = "";
      for (let i = 0; i < text.length; i++) {
        const code = text.charCodeAt(i);
        if (code >= 0xAC00 && code <= 0xD7A3) {
          out += CHOSUNG_TABLE[Math.floor((code - 0xAC00) / 588)];
        } else {
          out += text[i];
        }
      }
      return out;
    }

    function isOnlyChosung(text) {
      return /^[ㄱ-ㅎ]+$/.test(text);
    }

    /**
     * 왼쪽 상대 챔피언 이름, 한글 초성 및 두벌식 영타 입력에 대해 검색 매칭 수행
     */
    function matchesOpponentChampion(targetName, rawQuery) {
      const compactQuery = rawQuery.replace(/\s+/g, "").toLowerCase();
      if (!compactQuery) return true;

      const canonicalName = CHAMPION_ALIAS_MAP[targetName] || targetName;
      const candidates = [
        targetName.replace(/\s+/g, "").toLowerCase(),
        canonicalName.replace(/\s+/g, "").toLowerCase()
      ];

      const { jamoOnly, composed } = composeKoreanFromQwerty(compactQuery);
      const queryVariants = Array.from(
        new Set([compactQuery, jamoOnly.toLowerCase(), composed.toLowerCase()].filter(Boolean))
      );

      for (const cand of candidates) {
        const candChosung = extractChosung(cand).toLowerCase();
        for (const q of queryVariants) {
          if (cand.includes(q)) return true;
          if (isOnlyChosung(q) && candChosung.includes(q)) return true;
        }
      }
      return false;
    }

    function getTierBadgeStyle(tier) {
      switch (tier) {
        case 1:
          return "bg-rose-500/15 text-rose-300 border-rose-500/40";
        case 2:
          return "bg-blue-500/15 text-blue-300 border-blue-500/40";
        case 3:
          return "bg-teal-400/15 text-teal-300 border-teal-400/40";
        case 4:
          return "bg-slate-400/15 text-slate-300 border-slate-400/35";
        default:
          return "bg-zinc-500/15 text-zinc-400 border-zinc-500/30";
      }
    }

    function getAvatarPalette(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      const palettes = [
        { from: "#26365c", to: "#151d33", ring: "#4f86ff" },
        { from: "#4a2338", to: "#24121d", ring: "#ff5d6c" },
        { from: "#1b4347", to: "#0f2427", ring: "#2dd4bf" },
        { from: "#3b2c5e", to: "#1d1630", ring: "#a78bfa" },
        { from: "#4d381e", to: "#261b0e", ring: "#fbbf24" }
      ];
      return palettes[Math.abs(hash) % palettes.length];
    }

    function createInitialFallbackSvg(label, sizeClass) {
      const char = (label || "?").trim().charAt(0);
      const pal = getAvatarPalette(label);
      const gradId = `g_${char.charCodeAt(0)}_${Math.abs(label.length * 17)}`;
      return `
        <svg class="${sizeClass} rounded-xl shrink-0 select-none" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="${gradId}" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="${pal.from}" />
              <stop offset="100%" stop-color="${pal.to}" />
            </linearGradient>
          </defs>
          <rect width="40" height="40" rx="11" fill="url(#${gradId})" stroke="${pal.ring}" stroke-opacity="0.45" stroke-width="1.5" />
          <text x="20" y="25" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Pretendard, sans-serif">${char}</text>
        </svg>
      `;
    }

    function createChampionIconHtml(name, sizeClass, imgClass) {
      const iconUrl = getChampionSquareIconUrl(name);
      const fallbackSvg = createInitialFallbackSvg(name, sizeClass);
      if (!iconUrl) {
        return `<span class="inline-flex items-center justify-center shrink-0">${fallbackSvg}</span>`;
      }

      const fallbackVersion = DDRAGON_FALLBACK_VERSIONS[DDRAGON_FALLBACK_VERSIONS.length - 1];
      const fallbackUrl = getChampionSquareIconUrl(name, fallbackVersion);

      return `
        <span class="relative inline-flex items-center justify-center ${sizeClass} rounded-xl overflow-hidden bg-deep-panel border border-deep-border shrink-0">
          <img
            src="${iconUrl}"
            alt="${name}"
            loading="lazy"
            decoding="async"
            class="${imgClass} object-cover"
            onerror="if (!this.dataset.fb) { this.dataset.fb = '1'; this.src = '${fallbackUrl}'; } else { this.style.display = 'none'; this.nextElementSibling.style.display = 'flex'; }"
          />
          <span class="hidden w-full h-full items-center justify-center">${fallbackSvg}</span>
        </span>
      `;
    }

    // 초기 기본 베이스는 '티어순' (TIER), '티어순' 버튼 활성 상태
    let selectedTier = "ALL";
    let selectedSort = "TIER";

    const searchInput = document.getElementById("searchInput");
    const clearSearchBtn = document.getElementById("clearSearchBtn");
    const matchupList = document.getElementById("matchupList");
    const summaryText = document.getElementById("summaryText");
    const ddragonPatchBadge = document.getElementById("ddragonPatchBadge");
    const resetAllCountersBtn = document.getElementById("resetAllCountersBtn");
    const resetAllDivider = document.getElementById("resetAllDivider");
    const emptyState = document.getElementById("emptyState");
    const resetFiltersBtn = document.getElementById("resetFiltersBtn");
    const tierButtons = document.querySelectorAll(".tier-btn");
    const sortButtons = document.querySelectorAll(".sort-btn");

    const counterEditorModal = document.getElementById("counterEditorModal");
    const closeEditorModalBtn = document.getElementById("closeEditorModalBtn");
    const doneEditorModalBtn = document.getElementById("doneEditorModalBtn");
    const editorTargetTierBadge = document.getElementById("editorTargetTierBadge");
    const editorTargetIcon = document.getElementById("editorTargetIcon");
    const editorModalTitle = document.getElementById("editorModalTitle");
    const editorCurrentCounters = document.getElementById("editorCurrentCounters");
    const resetRowCountersBtn = document.getElementById("resetRowCountersBtn");
    const editorCounterInput = document.getElementById("editorCounterInput");
    const addCounterSubmitBtn = document.getElementById("addCounterSubmitBtn");
    const editorFeedbackMsg = document.getElementById("editorFeedbackMsg");
    const editorQuickPickList = document.getElementById("editorQuickPickList");

    let activeEditingTarget = null;

    function setEditorFeedback(message, isError = false) {
      if (!message) {
        editorFeedbackMsg.textContent = "";
        editorFeedbackMsg.classList.add("hidden");
        return;
      }
      editorFeedbackMsg.textContent = message;
      editorFeedbackMsg.className = isError
        ? "mt-2 text-xs font-semibold text-rose-300"
        : "mt-2 text-xs font-semibold text-emerald-300";
      editorFeedbackMsg.classList.remove("hidden");
    }

    function getEditingMatchupItem() {
      if (!activeEditingTarget) return null;
      return getMatchupsSnapshot().find((m) => m.target === activeEditingTarget) || null;
    }

    function setRowCounters(targetName, nextCounters) {
      const baseItem = BASE_MATCHUPS.find((m) => m.target === targetName);
      if (!baseItem) return;
      const deduped = [];
      const seen = new Set();
      nextCounters.forEach((raw) => {
        const cleaned = (raw || "").trim();
        if (!cleaned) return;
        const key = cleaned.replace(/\s+/g, "").toLowerCase();
        if (!seen.has(key)) {
          seen.add(key);
          deduped.push(cleaned);
        }
      });

      const isSameAsDefault =
        deduped.length === baseItem.defaultCounters.length &&
        deduped.every((name, idx) => name === baseItem.defaultCounters[idx]);

      if (isSameAsDefault) {
        delete customCountersMap[targetName];
      } else {
        customCountersMap[targetName] = deduped;
      }
      saveCustomCountersToStorage();
    }

    function renderEditorModalContent() {
      const item = getEditingMatchupItem();
      if (!item) return;

      editorTargetTierBadge.textContent = `${item.tier}티어`;
      editorTargetTierBadge.className = `inline-flex items-center justify-center px-2.5 py-1 rounded-lg text-xs font-extrabold border shrink-0 ${getTierBadgeStyle(item.tier)}`;
      editorTargetIcon.innerHTML = createChampionIconHtml(
        item.target,
        "w-9 h-9",
        "w-9 h-9"
      );
      editorModalTitle.textContent = `${item.target} 카운터픽 수정`;

      if (item.counters.length === 0) {
        editorCurrentCounters.innerHTML = `<span class="text-xs text-deep-muted py-1">등록된 카운터 챔피언이 없습니다. 아래에서 추가해 주세요.</span>`;
      } else {
        editorCurrentCounters.innerHTML = item.counters
          .map((counterName) => {
            const miniIcon = createChampionIconHtml(counterName, "w-5 h-5", "w-5 h-5");
            return `
              <span class="inline-flex items-center gap-1.5 bg-deep-tag border border-deep-tagBorder rounded-xl pl-2 pr-1.5 py-1 text-xs sm:text-sm font-semibold text-slate-100">
                ${miniIcon}
                <span>${counterName}</span>
                <button
                  type="button"
                  data-remove-counter="${encodeURIComponent(counterName)}"
                  aria-label="${counterName} 카운터픽 삭제"
                  class="ml-0.5 w-5 h-5 rounded-lg bg-deep-bg/80 hover:bg-rose-500/25 text-deep-muted hover:text-rose-200 inline-flex items-center justify-center text-xs font-bold cursor-pointer transition-colors"
                >
                  ×
                </button>
              </span>
            `;
          })
          .join("");
      }

      const filterText = editorCounterInput.value.trim();
      const existingKeys = new Set(
        item.counters.map((c) => c.replace(/\s+/g, "").toLowerCase())
      );
      const candidates = getAllKnownChampions()
        .filter((champ) => {
          const champKey = champ.replace(/\s+/g, "").toLowerCase();
          if (existingKeys.has(champKey)) return false;
          if (!filterText) return true;
          return matchesChampionQuery(champ, filterText);
        })
        .slice(0, 24);

      if (candidates.length === 0) {
        editorQuickPickList.innerHTML = `<span class="text-xs text-deep-muted py-1">추가 가능한 챔피언이 없거나 이미 모두 추가되었습니다.</span>`;
      } else {
        editorQuickPickList.innerHTML = candidates
          .map((champ) => {
            const miniIcon = createChampionIconHtml(champ, "w-4 h-4", "w-4 h-4");
            return `
              <button
                type="button"
                data-quick-add="${encodeURIComponent(champ)}"
                class="inline-flex items-center gap-1 px-2 py-1 rounded-lg bg-deep-row hover:bg-blue-600/25 border border-deep-border hover:border-blue-500/50 text-xs font-semibold text-slate-200 hover:text-white cursor-pointer transition-colors"
              >
                ${miniIcon}
                <span>${champ}</span>
              </button>
            `;
          })
          .join("");
      }
    }

    function openCounterEditor(targetName) {
      activeEditingTarget = targetName;
      editorCounterInput.value = "";
      setEditorFeedback("");
      renderEditorModalContent();
      counterEditorModal.classList.remove("hidden");
      editorCounterInput.focus();
    }

    function closeCounterEditor() {
      activeEditingTarget = null;
      setEditorFeedback("");
      counterEditorModal.classList.add("hidden");
    }

    function addCounterToActiveRow(rawInput) {
      const item = getEditingMatchupItem();
      if (!item) return;

      const resolvedName = normalizeCounterInputName(rawInput);
      if (!resolvedName) {
        setEditorFeedback("추가할 챔피언 이름을 입력하거나 선택해 주세요.", true);
        return;
      }

      const nextKey = resolvedName.replace(/\s+/g, "").toLowerCase();
      const alreadyExists = item.counters.some(
        (c) => c.replace(/\s+/g, "").toLowerCase() === nextKey
      );
      if (alreadyExists) {
        setEditorFeedback(`${resolvedName}은(는) 이미 카운터픽에 등록되어 있습니다.`, true);
        return;
      }

      setRowCounters(item.target, [...item.counters, resolvedName]);
      editorCounterInput.value = "";
      setEditorFeedback(`${resolvedName} 카운터픽이 추가되었습니다.`, false);
      renderEditorModalContent();
      renderMatchups();
    }

    function removeCounterFromActiveRow(counterName) {
      const item = getEditingMatchupItem();
      if (!item) return;
      const targetKey = counterName.replace(/\s+/g, "").toLowerCase();
      const nextCounters = item.counters.filter(
        (c) => c.replace(/\s+/g, "").toLowerCase() !== targetKey
      );
      setRowCounters(item.target, nextCounters);
      setEditorFeedback(`${counterName} 카운터픽이 삭제되었습니다.`, false);
      renderEditorModalContent();
      renderMatchups();
    }

    function renderMatchups() {
      try {
        const query = searchInput.value.trim();
        clearSearchBtn.classList.toggle("hidden", query.length === 0);

        const anyCustomized = BASE_MATCHUPS.some((m) => hasCustomCounterOverride(m));
        resetAllCountersBtn.classList.toggle("hidden", !anyCustomized);
        resetAllDivider.classList.toggle("hidden", !anyCustomized);

        const tierBaseMatchups = getTierBaseMatchups();
        let rows = tierBaseMatchups.filter((item) => {
          const tierMatched = selectedTier === "ALL" || String(item.tier) === selectedTier;
          const nameMatched = matchesOpponentChampion(item.target, query);
          return tierMatched && nameMatched;
        });

        if (selectedSort === "TIER") {
          rows = [...rows].sort((a, b) => a.tier - b.tier || a.order - b.order);
        } else if (selectedSort === "DEFAULT") {
          rows = [...rows].sort((a, b) => a.order - b.order);
        } else if (selectedSort === "ALPHA") {
          rows = [...rows].sort((a, b) => a.target.localeCompare(b.target, "ko"));
        }

        const tierLabel = selectedTier === "ALL" ? "전체 티어" : `${selectedTier}티어`;
        summaryText.textContent = `표시 ${rows.length}개 / 전체 ${BASE_MATCHUPS.length}개 (${tierLabel} · 정글 티어 DB 58명)`;

        matchupList.innerHTML = "";

        if (rows.length === 0) {
          emptyState.classList.remove("hidden");
          return;
        }
        emptyState.classList.add("hidden");

        const fragment = document.createDocumentFragment();

        rows.forEach((item) => {
          const card = document.createElement("article");
          card.className =
            "bg-deep-row hover:bg-deep-rowHover border border-deep-border hover:border-blue-500/40 rounded-2xl px-3.5 sm:px-5 py-3 transition-all flex flex-col md:flex-row md:items-center justify-between gap-2.5 md:gap-4";

          const tierBadgeClass = getTierBadgeStyle(item.tier);
          const leftIconHtml = createChampionIconHtml(
            item.target,
            "w-9 h-9 sm:w-10 sm:h-10",
            "w-9 h-9 sm:w-10 sm:h-10"
          );

          const counterTagsHtml = item.counters
            .map((counterName) => {
              const miniIconHtml = createChampionIconHtml(
                counterName,
                "w-5 h-5 sm:w-6 sm:h-6",
                "w-5 h-5 sm:w-6 sm:h-6"
              );
              return `
                <span class="inline-flex items-center gap-1.5 bg-deep-tag border border-deep-tagBorder rounded-xl px-2.5 py-1 text-xs sm:text-sm font-semibold text-slate-100 whitespace-nowrap shrink-0">
                  ${miniIconHtml}
                  <span>${counterName}</span>
                </span>
              `;
            })
            .join("");

          const customIndicatorHtml = item.isCustomized
            ? `<span class="px-1.5 py-0.5 rounded-md text-[11px] font-bold bg-blue-500/15 text-blue-300 border border-blue-500/35 shrink-0">수정됨</span>`
            : "";

          card.innerHTML = `
            <div class="flex items-center gap-2.5 sm:gap-3 min-w-0 shrink-0">
              <span class="inline-flex items-center justify-center min-w-[52px] px-2.5 py-1 rounded-lg text-xs font-extrabold border ${tierBadgeClass} shrink-0">
                ${item.tier}티어
              </span>
              ${leftIconHtml}
              <span class="text-sm sm:text-base font-bold text-white whitespace-nowrap">
                ${item.target}
              </span>
              ${customIndicatorHtml}
            </div>
            <div class="flex items-center md:justify-end flex-wrap gap-1.5 sm:gap-2">
              ${counterTagsHtml}
              <button
                type="button"
                data-edit-target="${encodeURIComponent(item.target)}"
                aria-label="${item.target} 카운터픽 추가 및 삭제"
                title="${item.target} 카운터픽 수정"
                class="w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-deep-panel hover:bg-blue-600 text-blue-300 hover:text-white border border-deep-border hover:border-blue-500 inline-flex items-center justify-center text-base font-extrabold cursor-pointer transition-colors shrink-0"
              >
                +
              </button>
            </div>
          `;

          fragment.appendChild(card);
        });

        matchupList.appendChild(fragment);
      } catch (err) {
        matchupList.innerHTML = `<div class="bg-rose-950/40 border border-rose-500/40 text-rose-200 rounded-xl p-4 text-sm">목록 렌더링 중 오류가 발생했습니다: ${err.message}</div>`;
      }
    }

    async function resolveLatestDDragonVersion() {
      try {
        const res = await fetch("https://ddragon.leagueoflegends.com/api/versions.json", {
          cache: "no-store"
        });
        if (!res.ok) throw new Error("versions.json 응답 실패");
        const versions = await res.json();
        if (Array.isArray(versions) && versions.length > 0 && typeof versions[0] === "string") {
          activeDDragonVersion = versions[0];
          ddragonPatchBadge.textContent = `DDragon 패치 ${activeDDragonVersion}`;
          renderMatchups();
          return;
        }
        throw new Error("버전 목록 형식 오류");
      } catch (_err) {
        activeDDragonVersion = DDRAGON_FALLBACK_VERSIONS[0];
        ddragonPatchBadge.textContent = `DDragon 패치 ${activeDDragonVersion} (폴백)`;
        renderMatchups();
      }
    }

    searchInput.addEventListener("input", renderMatchups);

    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = "";
      renderMatchups();
      searchInput.focus();
    });

    tierButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        selectedTier = btn.dataset.tier;
        syncButtonStates();
        renderMatchups();
      });
    });

    sortButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        selectedSort = btn.dataset.sort;
        syncButtonStates();
        renderMatchups();
      });
    });

    resetFiltersBtn.addEventListener("click", () => {
      searchInput.value = "";
      selectedTier = "ALL";
      selectedSort = "TIER";
      syncButtonStates();
      renderMatchups();
    });

    resetAllCountersBtn.addEventListener("click", () => {
      customCountersMap = {};
      saveCustomCountersToStorage();
      if (activeEditingTarget) {
        setEditorFeedback("전체 카운터픽이 기본값으로 초기화되었습니다.", false);
        renderEditorModalContent();
      }
      renderMatchups();
    });

    matchupList.addEventListener("click", (event) => {
      const editBtn = event.target.closest("[data-edit-target]");
      if (!editBtn) return;
      const decodedTarget = decodeURIComponent(editBtn.getAttribute("data-edit-target") || "");
      if (decodedTarget) {
        openCounterEditor(decodedTarget);
      }
    });

    closeEditorModalBtn.addEventListener("click", closeCounterEditor);
    doneEditorModalBtn.addEventListener("click", closeCounterEditor);

    counterEditorModal.addEventListener("click", (event) => {
      if (event.target === counterEditorModal) {
        closeCounterEditor();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !counterEditorModal.classList.contains("hidden")) {
        closeCounterEditor();
      }
    });

    addCounterSubmitBtn.addEventListener("click", () => {
      addCounterToActiveRow(editorCounterInput.value);
    });

    editorCounterInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        addCounterToActiveRow(editorCounterInput.value);
      }
    });

    editorCounterInput.addEventListener("input", () => {
      setEditorFeedback("");
      renderEditorModalContent();
    });

    editorCurrentCounters.addEventListener("click", (event) => {
      const removeBtn = event.target.closest("[data-remove-counter]");
      if (!removeBtn) return;
      const decodedName = decodeURIComponent(removeBtn.getAttribute("data-remove-counter") || "");
      if (decodedName) {
        removeCounterFromActiveRow(decodedName);
      }
    });

    editorQuickPickList.addEventListener("click", (event) => {
      const quickBtn = event.target.closest("[data-quick-add]");
      if (!quickBtn) return;
      const decodedChamp = decodeURIComponent(quickBtn.getAttribute("data-quick-add") || "");
      if (decodedChamp) {
        addCounterToActiveRow(decodedChamp);
      }
    });

    resetRowCountersBtn.addEventListener("click", () => {
      const item = getEditingMatchupItem();
      if (!item) return;
      delete customCountersMap[item.target];
      saveCustomCountersToStorage();
      setEditorFeedback(`${item.target}의 카운터픽을 기본값으로 복원했습니다.`, false);
      renderEditorModalContent();
      renderMatchups();
    });

    syncButtonStates();
    renderMatchups();
    resolveLatestDDragonVersion();
  </script>
</body>
</html>
